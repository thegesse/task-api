name: Secret Demo

on:
  push:
    branches: ["main", "tp2"]
  workflow_dispatch:

jobs:
  check-secrets-and-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret and environment variable
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Error: DEMO_TOKEN is empty or not defined!"
            exit 1
          fi
          echo "Secret length: ${#DEMO_TOKEN}"
          echo "Secret value: $DEMO_TOKEN"
          echo "App Environment: $APP_ENV"