name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables (lowercase repo owner & app version)
        id: prep
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "APP_VERSION=dev" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.prep.outputs.OWNER_LC }}/task-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.prep.outputs.APP_VERSION }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image reference
        id: prep
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Run container (Staging)
        run: |
          docker run -d --name api-staging -p 8000:8000 ghcr.io/${{ steps.prep.outputs.OWNER_LC }}/task-api:sha-${{ steps.prep.outputs.SHORT_SHA }}

      - name: Smoke test (/health and /version)
        run: |
          echo "Attente du démarrage de l'application..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Application prête !"
              exit 0
            fi
            sleep 3
          done
          echo "Échec du test de fumée"
          docker logs api-staging
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image reference
        id: prep
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Run container (Production)
        run: |
          docker run -d --name api-prod -p 8000:8000 ghcr.io/${{ steps.prep.outputs.OWNER_LC }}/task-api:${{ steps.prep.outputs.VERSION }}

      - name: Smoke test release (/health and /version)
        run: |
          echo "Attente du démarrage de l'application en production..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Application de production prête !"
              exit 0
            fi
            sleep 3
          done
          echo "Échec du test de fumée production"
          docker logs api-prod
          exit 1
  update-config:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/task-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Run script to update image tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          bash scripts/set-image-tag.sh config/config-repo/k8s/deployment.yaml "$CLEAN_VERSION"

      - name: Commit and push config changes
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config-repo/k8s/deployment.yaml
          git commit -m "Update image tag to $VERSION" || echo "No changes to commit"
          git push