# Jour 4 : décrit à Argo CD quel dépôt surveiller et où déployer.
# À MODIFIER : remplacez <votre-compte-github> par votre identifiant GitHub (minuscules).
# Appliquer avec : kubectl apply -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thegesse/task-config.git
    targetRevision: master
    path: config-repo/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: task
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
